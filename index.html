<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voltix - Gestione Preventivi</title>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SheetJS per Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121214;
            --bg-card: #1a1a1e;
            --primary: #ccff00;
            --text-main: #ffffff;
            --text-muted: #a0a0a5;
            --border: #2a2a30;
            --danger: #ff4444;
            --success: #00e676;
            --warning: #ffb300;
        }

        /* INSERISCI QUI I TUOI DATI SUPABASE */
        const SUPABASE_URL = "https://akyshoozwyxezvqvtncm.supabase.co";
        const SUPABASE_KEY = "sb_publishable_iYFqaixRwg08V60Aj2lc1g_BkDWK6II";
        
        /* INSERISCI QUI LA PASSWORD DI ACCESSO PER I DIPENDENTI */
        const APP_PASSWORD = "Eatsleepraverepeat1";

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 40px; -webkit-tap-highlight-color: transparent; }
        
        /* Login */
        .login-screen { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg-dark); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-card { background: var(--bg-card); padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; border: 1px solid var(--border); }
        
        /* Layout */
        header { background: var(--bg-card); padding: 15px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; sticky: top; top: 0; z-index: 100; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-img { height: 35px; width: auto; object-fit: contain; }
        .logo-title { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
        .logo-title span { color: var(--primary); }
        
        .container { padding: 15px; max-width: 1200px; margin: 0 auto; }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; }
        .tab-btn.active { background: var(--primary); color: var(--bg-dark); border-color: var(--primary); }
        
        .panel { display: none; }
        .panel.active { display: block; }
        
        /* Form e Input */
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        @media(max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group.full { grid-column: 1 / -1; }
        label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
        input, select, textarea { background: #222226; border: 1px solid var(--border); padding: 12px; border-radius: 8px; color: #fff; font-size: 14px; outline: none; width: 100%; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); }
        
        /* Buttons */
        .btn { background: var(--primary); color: var(--bg-dark); border: none; padding: 12px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; font-size: 14px; display: flex; justify-content: center; align-items: center; gap: 8px; text-transform: uppercase; }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-sm { padding: 6px 12px; font-size: 11px; border-radius: 6px; width: auto; }
        
        /* Lista Articoli Preventivo */
        .articolo-row { background: #222226; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 3px solid var(--primary); position: relative; }
        .articolo-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
        .articolo-details { font-size: 12px; color: var(--text-muted); }
        
        /* Liste/Card Preventivi */
        .item-list { display: flex; flex-direction: column; gap: 12px; }
        .item-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; position: relative; }
        .item-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .item-name { font-weight: 600; font-size: 15px; }
        .item-meta { font-size: 12px; color: var(--text-muted); }
        .item-price { font-weight: 700; color: var(--primary); font-size: 16px; }
        
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge-attesa { background: #3a2f00; color: var(--warning); }
        .badge-approvato { background: #003311; color: var(--success); }
        .badge-rifiutato { background: #330000; color: var(--danger); }
        
        .totale-box { background: #222226; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: right; }
        .totale-box h3 { color: var(--primary); font-size: 20px; }

        /* Autocompletamento Catalogo */
        .suggestions { background: #222226; border: 1px solid var(--border); border-top: none; border-radius: 0 0 8px 8px; max-height: 150px; overflow-y: auto; display: none; position: absolute; z-index: 10; width: 100%; }
        .suggestion-item { padding: 10px; cursor: pointer; font-size: 13px; border-bottom: 1px solid var(--border); }
        .suggestion-item:hover { background: var(--bg-card); }
        
        /* Stampa PDF Pulita */
        @media print {
            body { background: white; color: black; padding: 0; }
            header, .nav-tabs, .btn, .no-print, .login-screen, input, select, textarea, .totale-box button { display: none !important; }
            .panel { display: block !important; }
            .card { border: none; background: white; color: black; padding: 0; }
            .articolo-row { background: white; color: black; border: 1px solid #ccc; }
            .item-list, #form-preventivo-card { display: none !important; }
            #print-preview-area { display: block !important; color: black; background: white; padding: 20px; }
        }
        #print-preview-area { display: none; }
    </style>
</head>
<body>

    <!-- SCREEN LOGIN -->
    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <h2 style="margin-bottom: 20px; font-weight:700;">⚡ VOLTIX<br><span style="color:var(--primary); font-size:14px;">PREVENTIVI & PREZZI</span></h2>
            <input type="password" id="loginPassword" placeholder="Inserisci Password" style="text-align:center; margin-bottom:15px; letter-spacing:4px;">
            <button class="btn" onclick="checkLogin()">Entra</button>
        </div>
    </div>

    <!-- HEADER -->
    <header>
        <div class="logo-area">
            <img src="LOGO-VOLTIX-SOLO-ICONA-no-sfondo.png" alt="Voltix Logo" class="logo-img" onerror="this.style.display='none'">
            <div class="logo-title">VOLTIX <span>PREVENTIVI</span></div>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="esportaRegistroExcel()" style="width:auto;">Excel Registro 📊</button>
    </header>

    <div class="container">
        <!-- TABS NAV -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('tab-nuovo')">+ Nuovo</button>
            <button class="tab-btn" onclick="switchTab('tab-archivio')" id="btn-tab-archivio">Archivio</button>
            <button class="tab-btn" onclick="switchTab('tab-catalogo')">Listino prezzi</button>
        </div>

        <!-- TAB: NUOVO PREVENTIVO -->
        <div id="tab-nuovo" class="panel active">
            <div class="card" id="form-preventivo-card">
                <div class="card-title">Anagrafica Preventivo</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Num. Preventivo</label>
                        <input type="text" id="prev_numero" placeholder="Es. 01/2026">
                    </div>
                    <div class="form-group">
                        <label>Data</label>
                        <input type="date" id="prev_data">
                    </div>
                    <div class="form-group full">
                        <label>Cliente / Azienda</label>
                        <input type="text" id="prev_cliente" placeholder="Nome Cliente o Ragione Sociale">
                    </div>
                </div>

                <div class="card-title" style="margin-top:25px; border-top: 1px solid var(--border); padding-top:15px;">
                    Aggiungi Articolo / Prestazione
                </div>
                <div style="position:relative;" class="form-group">
                    <label>Cerca nel listino o scrivi descrizione</label>
                    <input type="text" id="art_descrizione" placeholder="Es. Cavo FG16 3G2.5 o Manodopera" oninput="cercaNelCatalogo(this.value)">
                    <div id="catalogo-suggestions" class="suggestions"></div>
                </div>
                <div class="form-grid" style="margin-top:10px;">
                    <div class="form-group">
                        <label>Prezzo Unitario (€)</label>
                        <input type="number" step="0.01" id="art_prezzo" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label>Quantità</label>
                        <input type="number" step="0.1" id="art_qta" value="1">
                    </div>
                </div>
                <button class="btn btn-secondary" onclick="aggiungiArticoloInLista()" style="margin-bottom:20px;">+ Inserisci nel preventivo</button>

                <div class="card-title">Articoli Inseriti</div>
                <div id="lista-articoli-correnti">
                    <!-- Articoli inseriti al momento -->
                </div>

                <div class="totale-box">
                    <p style="font-size:13px; color:var(--text-muted);">Totale Imponibile: <span id="lbl-imponibile">0.00</span> €</p>
                    <h3>Totale Ivato (22%): <span id="lbl-totale">0.00</span> €</h3>
                </div>

                <div class="form-group full" style="margin-top:15px; margin-bottom:15px;">
                    <label>Note / Condizioni di pagamento</label>
                    <textarea id="prev_note" rows="2" placeholder="Es. Pagamento 30gg data fattura, materiali inclusi..."></textarea>
                </div>

                <button class="btn" onclick="salvaPreventivoCloud()">💾 Salva e Sincronizza Cloud</button>
            </div>
        </div>

        <!-- TAB: ARCHIVIO PREVENTIVI -->
        <div id="tab-archivio" class="panel">
            <div class="item-list" id="lista-preventivi-cloud">
                <!-- Caricati da Supabase -->
            </div>
        </div>

        <!-- TAB: LISTINO PREZZI SALVATI -->
        <div id="tab-catalogo" class="panel">
            <div class="card">
                <div class="card-title">Salva nuovo prodotto/prezzo fisso</div>
                <div class="form-group" style="margin-bottom:10px;">
                    <label>Descrizione Articolo o Servizio</label>
                    <input type="text" id="cat_descrizione" placeholder="Es. Punto luce deviato">
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Prezzo (€)</label>
                        <input type="number" step="0.01" id="cat_prezzo" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label>Unità di misura</label>
                        <select id="cat_um">
                            <option value="pz">A pezzo (pz)</option>
                            <option value="m">Al metro (m)</option>
                            <option value="ora">All'ora (ora)</option>
                            <option value="corpo">A corpo</option>
                        </select>
                    </div>
                </div>
                <button class="btn" onclick="salvaInCatalogoListino()" style="margin-top:10px;">Salva nel Listino</button>
            </div>

            <div class="card-title">Listino Prezzi Aziendale</div>
            <div class="item-list" id="lista-catalogo-prodotti">
                <!-- Prodotti nel catalogo -->
            </div>
        </div>
    </div>

    <!-- AREA DI STAMPA/PDF NASCOSTA -->
    <div id="print-preview-area"></div>

    <script>
        let supabaseClient = null;
        let articoliPreventivoCorrente = [];
        let catalogoProdottiLocale = [];

        // Inizializzazione e Login
        function checkLogin() {
            const pass = document.getElementById('loginPassword').value;
            if(pass === APP_PASSWORD) {
                document.getElementById('loginScreen').style.display = 'none';
                initSupabase();
            } else {
                alert("Password errata!");
            }
        }

        function initSupabase() {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            document.getElementById('prev_data').valueAsDate = new Date();
            caricaPreventivi();
            caricaCatalogo();
        }

        // Gestione Navigazione Tab
        function switchTab(tabId) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
            if(tabId === 'tab-archivio') caricaPreventivi();
            if(tabId === 'tab-catalogo') caricaCatalogo();
        }

        // logica catalogo prodotti rapido
        async function salvaInCatalogoListino() {
            const desc = document.getElementById('cat_descrizione').value.trim();
            const prezzo = parseFloat(document.getElementById('cat_prezzo').value);
            const um = document.getElementById('cat_um').value;

            if(!desc || isNaN(prezzo)) return alert("Compila descrizione e prezzo correttamente");

            const { error } = await supabaseClient.from('catalogo_prodotti').insert([{ descrizione: desc, prezzo_unitario: prezzo, unita_misura: um }]);
            if(error) return alert("Errore di salvataggio: " + error.message);

            document.getElementById('cat_descrizione').value = '';
            document.getElementById('cat_prezzo').value = '';
            caricaCatalogo();
            alert("Prodotto salvato nel listino!");
        }

        async function caricaCatalogo() {
            const { data, error } = await supabaseClient.from('catalogo_prodotti').select('*').order('descrizione', { ascending: true });
            if(!error && data) {
                catalogoProdottiLocale = data;
                const container = document.getElementById('lista-catalogo-prodotti');
                container.innerHTML = data.map(p => `
                    <div class="item-card">
                        <div class="item-row">
                            <span class="item-name">${p.descrizione}</span>
                            <span class="item-price">${p.prezzo_unitario.toFixed(2)} € <span style="font-size:11px; color:var(--text-muted);">/${p.unita_misura}</span></span>
                        </div>
                        <button class="btn btn-danger btn-sm" onclick="eliminaDaCatalogo(${p.id})">Elimina</button>
                    </div>
                `).join('');
            }
        }

        async function eliminaDaCatalogo(id) {
            if(confirm("Eliminare questo prodotto dal listino?")) {
                await supabaseClient.from('catalogo_prodotti').delete().eq('id', id);
                caricaCatalogo();
            }
        }

        // Suggerimenti durante la digitazione nel preventivo
        function cercaNelCatalogo(valore) {
            const suggestionsBox = document.getElementById('catalogo-suggestions');
            if(!valore) { suggestionsBox.style.display = 'none'; return; }
            
            const filtrati = catalogoProdottiLocale.filter(p => p.descrizione.toLowerCase().includes(valore.toLowerCase()));
            if(filtrati.length === 0) { suggestionsBox.style.display = 'none'; return; }

            suggestionsBox.innerHTML = filtrati.map(p => `
                <div class="suggestion-item" onclick="selezionaProdottoCatalogo('${p.descrizione.replace(/'/g, "\\'")}', ${p.prezzo_unitario})">
                    ${p.descrizione} - <strong>${p.prezzo_unitario.toFixed(2)} €</strong>
                </div>
            `).join('');
            suggestionsBox.style.display = 'block';
        }

        function selezionaProdottoCatalogo(desc, prezzo) {
            document.getElementById('art_descrizione').value = desc;
            document.getElementById('art_prezzo').value = prezzo;
            document.getElementById('catalogo-suggestions').style.display = 'none';
        }

        // Composizione del Preventivo Corrente
        function aggiungiArticoloInLista() {
            const desc = document.getElementById('art_descrizione').value.trim();
            const prezzo = parseFloat(document.getElementById('art_prezzo').value);
            const qta = parseFloat(document.getElementById('art_qta').value);

            if(!desc || isNaN(prezzo) || isNaN(qta)) return alert("Compila i dettagli dell'articolo");

            articoliPreventivoCorrente.push({ descrizione: desc, prezzo_unitario: prezzo, quantita: qta, totale: prezzo * qta });
            
            document.getElementById('art_descrizione').value = '';
            document.getElementById('art_prezzo').value = '';
            document.getElementById('art_qta').value = '1';
            
            aggiornaInterfacciaArticoli();
        }

        function rimuoviArticoloDaLista(index) {
            articoliPreventivoCorrente.splice(index, 1);
            aggiornaInterfacciaArticoli();
        }

        function aggiornaInterfacciaArticoli() {
            const container = document.getElementById('lista-articoli-correnti');
            let imponibile = 0;

            container.innerHTML = articoliPreventivoCorrente.map((art, idx) => {
                imponibile += art.totale;
                return `
                    <div class="articolo-row">
                        <div class="articolo-header">
                            <span>${art.descrizione}</span>
                            <span style="color:var(--primary); font-weight:700;">${art.totale.toFixed(2)} €</span>
                        </div>
                        <div class="articolo-details">
                            ${art.quantita} x ${art.prezzo_unitario.toFixed(2)} €
                        </div>
                        <span onclick="rimuoviArticoloDaLista(${idx})" style="position:absolute; top:10px; right:10px; color:var(--danger); font-size:12px; cursor:pointer; font-weight:700;">X</span>
                    </div>
                `;
            }).join('');

            const ivato = imponibile * 1.22;
            document.getElementById('lbl-imponibile').innerText = imponibile.toFixed(2);
            document.getElementById('lbl-totale').innerText = ivato.toFixed(2);
        }

        // Salva nel Cloud di Supabase
        async function salvaPreventivoCloud() {
            const num = document.getElementById('prev_numero').value.trim();
            const data = document.getElementById('prev_data').value;
            const cliente = document.getElementById('prev_cliente').value.trim();
            const note = document.getElementById('prev_note').value;
            const imponibile = parseFloat(document.getElementById('lbl-imponibile').innerText);
            const ivato = parseFloat(document.getElementById('lbl-totale').innerText);

            if(!num || !cliente || articoliPreventivoCorrente.length === 0) {
                return alert("Inserisci Numero, Cliente e almeno un articolo nel preventivo!");
            }

            const payload = {
                numero_preventivo: num,
                data_preventivo: data,
                cliente: cliente,
                note: note,
                articoli: articoliPreventivoCorrente,
                totale_imponibile: imponibile,
                totale_ivato: ivato,
                stato: 'In attesa'
            };

            const { error } = await supabaseClient.from('preventivi').insert([payload]);
            if(error) return alert("Errore nel salvataggio Cloud: " + error.message);

            alert("Preventivo salvato e sincronizzato nel Cloud!");
            // Reset Campi
            document.getElementById('prev_numero').value = '';
            document.getElementById('prev_cliente').value = '';
            document.getElementById('prev_note').value = '';
            articoliPreventivoCorrente = [];
            aggiornaInterfacciaArticoli();
            switchTab('tab-archivio');
        }

        // Mostra Archivio Preventivi Cloud
        async function caricaPreventivi() {
            const { data, error } = await supabaseClient.from('preventivi').select('*').order('created_at', { ascending: false });
            if(!error && data) {
                const container = document.getElementById('lista-preventivi-cloud');
                container.innerHTML = data.map(p => `
                    <div class="item-card">
                        <div class="item-row">
                            <span class="item-name">Prev. N° ${p.numero_preventivo}</span>
                            <span class="badge badge-${p.stato.toLowerCase().replace(" ", "-")}">${p.stato}</span>
                        </div>
                        <div class="item-row" style="margin-bottom:15px;">
                            <span class="item-meta">Cliente: <strong>${p.cliente}</strong><br>Data: ${new Date(p.data_preventivo).toLocaleDateString('it-IT')}</span>
                            <span class="item-price">${p.totale_ivato.toFixed(2)} € <br><span style="font-size:11px; color:var(--text-muted); font-weight:400;">(iva incl.)</span></span>
                        </div>
                        <div class="form-grid" style="grid-template-columns: 1fr 1fr 1fr; gap:6px;">
                            <select onchange="cambiaStatoPreventivo(${p.id}, this.value)" style="padding:6px; font-size:12px;">
                                <option value="In attesa" ${p.stato === 'In attesa' ? 'selected' : ''}>In attesa</option>
                                <option value="Approvato" ${p.stato === 'Approvato' ? 'selected' : ''}>Approvato</option>
                                <option value="Rifiutato" ${p.stato === 'Rifiutato' ? 'selected' : ''}>Rifiutato</option>
                            </select>
                            <button class="btn btn-secondary btn-sm" onclick="generaPDFPreventivo(${JSON.stringify(p).replace(/"/g, '&quot;')})">Genera PDF 📄</button>
                            <button class="btn btn-danger btn-sm" onclick="eliminaPreventivo(${p.id})">Elimina</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        async function cambiaStatoPreventivo(id, nuovoStato) {
            await supabaseClient.from('preventivi').update({ stato: nuovoStato }).eq('id', id);
            caricaPreventivi();
        }

        async function eliminaPreventivo(id) {
            if(confirm("Sei sicuro di voler eliminare definitivamente questo preventivo dal Cloud?")) {
                await supabaseClient.from('preventivi').delete().eq('id', id);
                caricaPreventivi();
            }
        }

        // GENERA E APRI PDF (Ottimizzato per cellulare/stampa)
        function generaPDFPreventivo(p) {
            const areaStampa = document.getElementById('print-preview-area');
            
            let tabellaArticoli = p.articoli.map(a => `
                <tr>
                    <td style="padding: 10px; border-bottom: 1px solid #ddd;">${a.descrizione}</td>
                    <td style="padding: 10px; border-bottom: 1px solid #ddd; text-align: center;">${a.quantita}</td>
                    <td style="padding: 10px; border-bottom: 1px solid #ddd; text-align: right;">${a.prezzo_unitario.toFixed(2)} €</td>
                    <td style="padding: 10px; border-bottom: 1px solid #ddd; text-align: right;">${a.totale.toFixed(2)} €</td>
                </tr>
            `).join('');

            areaStampa.innerHTML = `
                <div style="font-family: Arial, sans-serif; color: #333; line-height: 1.5; padding:20px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #ccff00; padding-bottom: 20px; margin-bottom:30px;">
                        <div>
                            <h1 style="margin: 0; color:#111; font-size:28px;">VOLTIX Impianti</h1>
                            <p style="margin: 5px 0 0 0; font-size:12px; color:#666;">Soluzioni Elettriche & Tecnologiche</p>
                        </div>
                        <div style="text-align: right;">
                            <h2 style="margin:0; color:#666; font-size:18px;">PREVENTIVO</h2>
                            <p style="margin:5px 0 0 0; font-weight: bold;">N° ${p.numero_preventivo}</p>
                            <p style="margin:2px 0 0 0; font-size:13px;">Data: ${new Date(p.data_preventivo).toLocaleDateString('it-IT')}</p>
                        </div>
                    </div>

                    <div style="margin-bottom: 40px; background:#f9f9f9; padding:15px; border-radius:6px; border-left:4px solid #ccff00;">
                        <p style="margin:0; font-size:11px; text-transform:uppercase; color:#888; font-weight:bold;">Destinatario / Cliente</p>
                        <p style="margin:5px 0 0 0; font-size:16px; font-weight:bold; color:#111;">${p.cliente}</p>
                    </div>

                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 30px;">
                        <thead>
                            <tr style="background: #1a1a1e; color: white;">
                                <th style="padding: 10px; text-align: left; font-size:13px;">Descrizione Prestazione / Materiale</th>
                                <th style="padding: 10px; text-align: center; font-size:13px; width:80px;">Q.tà</th>
                                <th style="padding: 10px; text-align: right; font-size:13px; width:100px;">Prezzo Un.</th>
                                <th style="padding: 10px; text-align: right; font-size:13px; width:100px;">Totale</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tabellaArticoli}
                        </tbody>
                    </table>

                    <div style="display: flex; justify-content: flex-end; margin-bottom: 40px;">
                        <div style="width: 250px; background:#f9f9f9; padding:15px; border-radius:6px; text-align:right;">
                            <p style="margin:0; font-size:13px;">Imponibile: <strong>${p.totale_imponibile.toFixed(2)} €</strong></p>
                            <p style="margin:5px 0 0 0; font-size:13px; border-bottom:1px solid #ddd; padding-bottom:5px;">IVA (22%): <strong>${(p.totale_ivato - p.totale_imponibile).toFixed(2)} €</strong></p>
                            <h3 style="margin:10px 0 0 0; color:#111; font-size:18px;">TOTALE: <span style="color:#b2dd00; filter: drop-shadow(0px 0px 1px black);">${p.totale_ivato.toFixed(2)} €</span></h3>
                        </div>
                    </div>

                    ${p.note ? `
                    <div style="margin-top: 30px; border-top:1px solid #eee; padding-top:15px;">
                        <p style="margin:0 0 5px 0; font-size:12px; font-weight:bold; color:#666;">Note e condizioni:</p>
                        <p style="margin:0; font-size:12px; color:#555; white-space: pre-wrap;">${p.note}</p>
                    </div>
                    ` : ''}
                </div>
            `;

            // Comando di stampa nativo dello smartphone (che permette di salvare in PDF)
            window.print();
        }

        // ESPORTAZIONE EXCEL COMPLETA DI TUTTO IL REGISTRO PREVENTIVI
        async function esportaRegistroExcel() {
            const { data, error } = await supabaseClient.from('preventivi').select('*').order('created_at', { ascending: false });
            if(error || !data) return alert("Errore nel recupero dati per l'esportazione");

            // Mappatura pulita dei dati per le colonne Excel
            const righeExcel = data.map(p => ({
                "Num. Preventivo": p.numero_preventivo,
                "Data": new Date(p.data_preventivo).toLocaleDateString('it-IT'),
                "Cliente": p.cliente,
                "Imponibile (€)": p.totale_imponibile,
                "Totale Ivato (€)": p.totale_ivato,
                "Stato": p.stato,
                "Note": p.note
            }));

            const worksheet = XLSX.utils.json_to_sheet(righeExcel);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Registro Preventivi");

            // Ottimizzazione larghezza colonne automatica
            const maxProps = [{wch: 15}, {wch: 12}, {wch: 30}, {wch: 15}, {wch: 15}, {wch: 15}, {wch: 40}];
            worksheet['!cols'] = maxProps;

            // Genera il file e avvia il download sullo smartphone
            XLSX.writeFile(workbook, `Voltix_Registro_Preventivi.xlsx`);
        }
    </script>
</body>
</html>
